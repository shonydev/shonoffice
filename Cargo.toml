[package]
name = "shonoffice"
version = "0.1.0"
edition = "2021"
description = "ShonOffice - gestor liviano de archivos Office"

[dependencies]
docx-rs = { version = "0.4", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
